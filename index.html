<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>UFO 회의록 위키</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root{
  --wb:#f3f7fb;--wcard:#fff;--wline:#d9e4ee;--wink:#1c2a39;--wmut:#627588;--whero:#cce3f5;--wnavy:#1f3047;--wnavy-ink:#fff;
  --wsoft:#dfecf9;--wtag:#e4eff9;--wtag-ink:#2f5f8a;--wnote:#edf4fb;--wmark:#ffe78a;--wbar:#a9cbe8;--wbar-on:#1f3047;--wshadow:rgba(20,40,60,.18);
  --wwarn:#9a5a00;--wwarn-bg:#fbefd6;--werr:#a3322a;--werr-bg:#f9e4e1;
  --f:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --wb:#101a23;--wcard:#16222d;--wline:#2a3a48;--wink:#e1e9f0;--wmut:#93a6b7;--whero:#1a3247;--wnavy:#a3d1f4;--wnavy-ink:#0f1a24;
  --wsoft:#1f3548;--wtag:#1c3245;--wtag-ink:#a3cdf1;--wnote:#182a39;--wmark:#6b5a12;--wbar:#3c6789;--wbar-on:#a3d1f4;--wshadow:rgba(0,0,0,.55);
  --wwarn:#e8b45a;--wwarn-bg:#3a2c12;--werr:#f08a80;--werr-bg:#3d1d1a;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--wb);color:var(--wink);font-family:var(--f);font-size:14px;line-height:1.55;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
mark{background:var(--wmark);color:inherit;border-radius:2px;padding:0 1px}
a{color:var(--wtag-ink)}
button,input,select{font-family:inherit}
button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--wnavy);outline-offset:2px}
[hidden]{display:none!important}
.w-root{container:wiki/inline-size;max-width:1480px;margin:0 auto}
.w-app{padding-block:10px 40px;display:grid;gap:14px}
.w-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--wmut)}
.w-brand{font-weight:700;color:var(--wink);font-size:13.5px}
.w-sync{flex:1;min-width:140px}
.w-btn{font-size:12.5px;border:1px solid var(--wline);background:var(--wcard);color:var(--wink);border-radius:8px;padding:3px 10px;cursor:pointer;line-height:1.5}
.w-btn:hover:not(:disabled){border-color:var(--wbar)}
.w-btn:disabled{opacity:.5;cursor:default}
.w-msg{border-radius:10px;padding:10px 14px;font-size:13.5px;background:var(--wwarn-bg);color:var(--wink);border:1px solid var(--wline)}
.w-msg.err{background:var(--werr-bg)}
.w-msg b{color:var(--wwarn)} .w-msg.err b{color:var(--werr)}
.w-hero{background:var(--whero);border-radius:20px;padding:24px 26px;display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:22px;align-items:center}
.w-hero h1{font-size:28px;line-height:1.25;margin:0 0 6px;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.w-hero p{margin:0 0 14px;font-size:13.5px;color:var(--wmut)}
.w-search{display:flex;align-items:center;gap:6px;background:var(--wcard);border:1px solid var(--wline);border-radius:12px;padding:5px 5px 5px 12px;max-width:660px}
.w-search:focus-within{border-color:var(--wnavy)}
.w-ico{color:var(--wmut);font-size:16px}
.w-search input{flex:1;min-width:0;border:0;background:transparent;font-size:15px;color:var(--wink);padding:8px 2px}
.w-search input:focus{outline:none}
.w-go{background:var(--wnavy);color:var(--wnavy-ink);border:0;border-radius:9px;font-weight:700;padding:9px 18px;cursor:pointer}
.w-recent{text-align:left;color:var(--wink);background:var(--wcard);border:0;border-radius:4px;padding:16px 16px 14px;transform:rotate(-1.5deg);box-shadow:0 4px 0 var(--wline);cursor:pointer;display:grid;gap:2px}
.w-recent:hover{transform:rotate(0)}
.w-recent .e{font-size:11.5px;color:var(--wmut)} .w-recent .t{font-size:18px;font-weight:700}
.w-recent .s{font-size:12.5px;color:var(--wmut)} .w-recent .g{font-size:12.5px;font-weight:700;margin-top:6px}
@media (prefers-reduced-motion:reduce){.w-recent,.w-recent:hover{transform:none}}
.w-tabs{display:flex;gap:4px;border-bottom:1px solid var(--wline);overflow-x:auto}
.w-tab{border:0;background:none;font-size:14.5px;padding:10px 12px;color:var(--wmut);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.w-tab[aria-selected="true"]{color:var(--wink);font-weight:700;border-bottom-color:var(--wnavy)}
.w-login{background:var(--wcard);border:1px solid var(--wline);border-radius:16px;padding:34px 22px;text-align:center;display:grid;gap:10px;justify-items:center}
.w-login h2{margin:0;font-size:20px}
.w-login p{margin:0;color:var(--wmut);max-width:52ch}
.w-login .w-go{padding:11px 26px;font-size:15px}
.w-body{display:grid;grid-template-columns:210px minmax(0,1fr) 330px;gap:18px;align-items:start}
.w-side{min-width:0}
.w-sinner{display:grid;gap:10px}
.w-shead{display:flex;justify-content:space-between;align-items:center;gap:6px}
.w-shead b{font-size:15px}
.w-only-narrow{display:none}
.w-seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
.w-seg button{border:1px solid var(--wline);background:var(--wcard);border-radius:8px;padding:5px 2px;font-size:12.5px;cursor:pointer;color:var(--wink)}
.w-seg button[aria-pressed="true"]{background:var(--wsoft);border-color:var(--wbar);font-weight:700}
.w-input{font-size:13px;width:100%;border:1px solid var(--wline);background:var(--wcard);color:var(--wink);border-radius:8px;padding:8px 10px}
.w-tree{list-style:none;margin:0;padding:0;display:grid;gap:1px;max-height:calc(100vh - 260px);min-height:160px;overflow:auto}
.w-node{display:flex;align-items:center;gap:6px;width:100%;border:0;background:none;text-align:left;font-size:13.5px;color:var(--wink);padding:6px 8px;border-radius:8px;cursor:pointer}
.w-node:hover{background:var(--wnote)}
.w-node[aria-pressed="true"]{background:var(--wsoft);font-weight:700}
.w-node .tw{width:10px;color:var(--wmut);font-size:9px;flex:none}
.w-node .k{color:var(--wmut);font-size:11.5px;margin-left:auto;font-variant-numeric:tabular-nums}
.w-node.zero{color:var(--wmut)}
.w-node.sub{padding-left:26px;font-size:12.5px}
.w-list{min-width:0;display:grid;gap:10px}
.w-lhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.w-lhead h2{font-size:19px;margin:0;font-weight:700}
.w-count{margin-left:auto;font-size:12.5px;color:var(--wmut);font-variant-numeric:tabular-nums}
.w-period{background:var(--wcard);border:1px solid var(--wline);border-radius:12px;padding:10px 12px;display:grid;gap:8px}
.w-prow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.w-plab{font-size:12.5px;color:var(--wmut);margin-right:2px}
.w-chip{font-size:12.5px;border:1px solid var(--wline);background:var(--wcard);color:var(--wink);border-radius:99px;padding:3px 11px;cursor:pointer}
.w-chip[aria-pressed="true"]{background:var(--wnavy);color:var(--wnavy-ink);border-color:var(--wnavy)}
.w-range{display:inline-flex;gap:4px;align-items:center;color:var(--wmut);flex-wrap:wrap}
.w-sel{font-size:12.5px;border:1px solid var(--wline);background:var(--wcard);color:var(--wink);border-radius:8px;padding:4px 6px;max-width:100%}
.w-months{display:flex;gap:10px;align-items:flex-end}
.w-ynav{display:flex;gap:4px;align-items:center;font-size:13px;flex:none;padding-bottom:14px}
.w-ynav .w-btn{padding:0 7px}
.w-bars{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:3px;flex:1;min-width:0}
.w-mb{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px;height:66px;border:0;background:none;cursor:pointer;padding:0;color:var(--wmut);font-size:10.5px;border-radius:6px;font-variant-numeric:tabular-nums}
.w-mb:hover:not(:disabled){background:var(--wnote)}
.w-mb i{display:block;width:62%;max-width:24px;background:var(--wbar);border-radius:3px 3px 0 0;min-height:2px}
.w-mb[aria-pressed="true"]{color:var(--wink);font-weight:700}
.w-mb[aria-pressed="true"] i{background:var(--wbar-on)}
.w-mb:disabled{cursor:default;opacity:.45}
.w-mb .n{min-height:13px}
.w-filters{display:flex;gap:8px 12px;flex-wrap:wrap;font-size:12.5px;color:var(--wmut);align-items:center}
.w-filters label{display:flex;gap:5px;align-items:center}
.w-grp{color:var(--wink);font-weight:600}
.w-grp input{accent-color:var(--wnavy);margin:0}
.w-applied{display:flex;gap:6px;flex-wrap:wrap;font-size:12.5px;align-items:center;min-height:24px}
.w-applied .lab{color:var(--wmut)}
.w-ap{background:var(--wsoft);border-radius:99px;padding:1px 2px 1px 10px;display:inline-flex;gap:2px;align-items:center}
.w-ap button{border:0;background:none;cursor:pointer;color:var(--wmut);padding:0 6px;border-radius:99px;font-size:13px}
.w-ap button:hover{color:var(--wink)}
.w-clear{border:0;background:none;color:var(--wtag-ink);font-size:12.5px;cursor:pointer;text-decoration:underline}
.w-cards{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.w-card{background:var(--wcard);border:1px solid var(--wline);border-radius:14px;padding:14px 18px;cursor:pointer;text-align:left;width:100%;color:inherit;display:block}
.w-card:hover{border-color:var(--wbar)}
.w-card[aria-current="true"]{border-color:var(--wnavy);box-shadow:0 0 0 1px var(--wnavy)}
.w-meta{font-size:11.5px;color:var(--wmut)}
.w-title{font-size:16.5px;font-weight:700;margin:3px 0 4px;display:block;overflow-wrap:anywhere}
.w-snip{font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.w-snip b{font-weight:600;color:var(--wmut);font-size:12px;margin-right:4px}
.w-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}
.w-tag{background:var(--wtag);color:var(--wtag-ink);font-size:11.5px;border-radius:5px;padding:2px 7px}
.w-tag.none{background:var(--wb);color:var(--wmut);border:1px dashed var(--wline)}
.w-tag.ex{background:var(--wb);color:var(--wmut);border:1px solid var(--wline)}
.w-tag.chk{background:var(--wwarn-bg);color:var(--wwarn)}
.w-badge{display:inline-block;font-size:11px;font-weight:700;border-radius:99px;padding:1px 8px;margin-left:6px;vertical-align:2px;background:var(--wsoft);color:var(--wtag-ink)}
.w-badge.chg{background:var(--wnavy);color:var(--wnavy-ink)}
.w-badge.old{background:var(--wb);color:var(--wmut);border:1px solid var(--wline)}
.w-day{display:flex;align-items:baseline;gap:8px;margin:10px 0 2px;font-size:13.5px}
.w-day b{font-size:14.5px} .w-day span{color:var(--wmut);font-size:12.5px}
.w-empty{background:var(--wcard);border:1px dashed var(--wline);border-radius:14px;padding:22px;text-align:center;color:var(--wmut);font-size:13.5px}
.w-more{justify-self:center}
.w-detail{min-width:0}
.w-dinner{background:var(--wcard);border:1px solid var(--wline);border-radius:14px;padding:16px 18px;display:grid;gap:10px;position:sticky;top:10px;max-height:calc(100vh - 20px);overflow:auto}
.w-dinner h3{font-size:19px;margin:0;line-height:1.3;overflow-wrap:anywhere}
.w-dhead{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.w-dact{display:flex;gap:6px;flex-wrap:wrap}
.w-dsec{display:grid;gap:3px}
.w-dsec>span{font-size:11.5px;color:var(--wmut);font-weight:600;letter-spacing:.04em}
.w-dsec p{margin:0;white-space:pre-wrap;word-break:break-word;font-size:13.5px}
.w-help{background:var(--wnote);border:1px solid var(--wline);border-radius:14px;padding:16px 18px;font-size:13px;color:var(--wmut);margin-bottom:12px}
.w-help b{display:block;color:var(--wink);font-size:14.5px;margin-bottom:6px}
.w-help p{margin:0 0 6px}
.w-tl{list-style:none;margin:0;padding:0 0 0 14px;border-left:2px solid var(--wline);display:grid;gap:10px}
.w-tl>li{position:relative}
.w-tl>li::before{content:"";position:absolute;left:-20px;top:8px;width:10px;height:10px;border-radius:50%;background:var(--wcard);border:2px solid var(--wbar)}
.w-tl>li.now::before{background:var(--wnavy);border-color:var(--wnavy)}
.w-tl>li.prv::before{width:8px;height:8px;left:-19px;border-style:dashed}
.w-ent{border:1px solid var(--wline);background:var(--wb);border-radius:10px;padding:8px 10px;display:grid;gap:3px;min-width:0}
.w-tl>li.now .w-ent{background:var(--wcard);border-color:var(--wnavy)}
.w-tl>li.prv .w-ent{border-style:dashed;opacity:.92}
.w-tl>li.sel .w-ent{box-shadow:0 0 0 2px var(--wbar)}
.w-ent .h{font-size:11.5px;color:var(--wmut)} .w-ent .h b{color:var(--wink)}
.w-ent .c{font-size:13px;white-space:pre-wrap;word-break:break-word}
.w-ent details>summary{cursor:pointer;list-style:none}
.w-ent details>summary::-webkit-details-marker{display:none}
.w-ent details .more{display:grid;gap:6px;margin-top:6px}
.w-ent .lab{font-size:11px;color:var(--wmut);font-weight:600}
.w-chg{display:flex;gap:4px;flex-wrap:wrap}
.w-chg span{font-size:11px;background:var(--wmark);color:var(--wink);border-radius:4px;padding:1px 6px}
.w-dict{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.w-dict button{text-align:left;background:var(--wcard);border:1px solid var(--wline);border-radius:10px;padding:9px 11px;cursor:pointer;color:var(--wink);display:grid}
.w-dict button:hover{border-color:var(--wbar)}
.w-dict small{color:var(--wmut);font-size:11.5px}
.w-foot{font-size:12px;color:var(--wmut);text-align:right}
@container wiki (max-width:1100px){
  .w-body{grid-template-columns:200px minmax(0,1fr)}
  .w-detail{position:fixed;top:0;right:0;bottom:0;width:min(400px,94vw);z-index:30;background:var(--wb);box-shadow:-10px 0 28px var(--wshadow);padding:12px;overflow:auto}
  .w-detail:not(.open){display:none}
  .w-dinner{position:static;max-height:none}
  .w-detail .w-only-narrow{display:inline-block}
}
@container wiki (max-width:720px){
  .w-body{grid-template-columns:minmax(0,1fr)}
  .w-side{display:none}
  .w-side.open{display:block;position:fixed;top:0;left:0;bottom:0;width:min(310px,90vw);z-index:31;background:var(--wb);box-shadow:10px 0 28px var(--wshadow);padding:14px;overflow:auto}
  .w-only-narrow{display:inline-block}
  .w-hero{grid-template-columns:1fr;padding:18px}
  .w-hero h1{font-size:21px}
  .w-recent{transform:none;box-shadow:none;border:1px solid var(--wline)}
  .w-search .w-sel{display:none}
  .w-ynav{padding-bottom:0}
  .w-months{flex-direction:column;align-items:stretch}
  .w-tree{max-height:none}
}
</style>
</head>
<body>
<div class="w-root"><div class="w-app" id="app">

  <div class="w-top">
    <span class="w-brand">UFO 회의록 위키</span>
    <span class="w-sync" id="w-sync" aria-live="polite"></span>
    <button type="button" class="w-btn" id="w-refresh" hidden>새로 받기</button>
    <button type="button" class="w-btn" id="w-all" hidden>전체 다시 받기</button>
    <button type="button" class="w-btn" id="w-logout" hidden>로그아웃 · 저장본 지우기</button>
  </div>
  <div class="w-msg" id="w-msg" hidden></div>

  <header class="w-hero">
    <div>
      <h1>궁금했던 그 기준,<br>여기서 같이 찾아봐요.</h1>
      <p>질문부터 판단의 근거까지, 함께 쌓아 온 기록을 찾아보세요.</p>
      <form class="w-search" id="w-form" role="search">
        <span class="w-ico" aria-hidden="true">⌕</span>
        <input id="w-q" type="search" autocomplete="off" placeholder="키워드, 데이터명, 카테고리로 검색" aria-label="검색어">
        <select id="w-scope" class="w-sel" aria-label="검색 범위"><option value="all">모든 칸</option><option value="name">데이터명만</option></select>
        <button class="w-go" type="submit">검색</button>
      </form>
    </div>
    <button type="button" class="w-recent" id="w-recent" hidden></button>
  </header>

  <div class="w-tabs" role="tablist" aria-label="보기">
    <button type="button" class="w-tab" role="tab" data-v="find">기록 찾기</button>
    <button type="button" class="w-tab" role="tab" data-v="meeting">회의별 보기</button>
    <button type="button" class="w-tab" role="tab" data-v="dict">카테고리 사전</button>
  </div>

  <section class="w-login" id="w-login" hidden>
    <h2 id="w-login-t">회사 구글 계정으로 로그인해 주세요</h2>
    <p id="w-login-p">회의록 시트를 공유받은 분만 내용을 볼 수 있어요. 처음 한 번 로그인하면 다음부터는 저장해 둔 내용을 바로 보여 드려요.</p>
    <button type="button" class="w-go" id="w-loginbtn">구글 계정으로 로그인</button>
  </section>

  <div class="w-body" id="w-bodywrap" hidden>
    <aside class="w-side" id="w-side" aria-label="분류 탐색">
      <div class="w-sinner">
        <div class="w-shead"><b>분류 탐색</b><span><button type="button" class="w-btn" id="w-creset">초기화</button> <button type="button" class="w-btn w-only-narrow" id="w-sclose">닫기</button></span></div>
        <div class="w-seg" id="w-dim" role="group" aria-label="분류 종류">
          <button type="button" data-d="관심사">관심사</button><button type="button" data-d="업종">업종</button><button type="button" data-d="기타">기타</button>
        </div>
        <input id="w-cfind" class="w-input" type="search" placeholder="분류명 또는 코드 찾기" aria-label="분류 찾기" autocomplete="off">
        <ul class="w-tree" id="w-tree"></ul>
      </div>
    </aside>

    <section class="w-list" aria-label="기록 목록">
      <div class="w-lhead"><h2 id="w-ltitle">함께 살펴본 기록</h2><span class="w-count" id="w-count"></span><button type="button" class="w-btn w-only-narrow" id="w-sopen">분류 ▾</button></div>

      <div class="w-period" id="w-period">
        <div class="w-prow" role="group" aria-label="기간">
          <span class="w-plab">기간</span>
          <button type="button" class="w-chip" data-p="all">전체</button>
          <button type="button" class="w-chip" data-p="last">지난 회의</button>
          <button type="button" class="w-chip" data-p="month">이번 달</button>
          <button type="button" class="w-chip" data-p="3m">최근 3개월</button>
          <button type="button" class="w-chip" data-p="year">올해</button>
          <button type="button" class="w-chip" data-p="prev">작년</button>
          <span class="w-range"><input type="date" id="w-from" class="w-sel" aria-label="시작일"><span>~</span><input type="date" id="w-to" class="w-sel" aria-label="종료일"></span>
        </div>
        <div class="w-months">
          <div class="w-ynav"><button type="button" class="w-btn" id="w-yprev" aria-label="이전 해">‹</button><b id="w-year"></b><button type="button" class="w-btn" id="w-ynext" aria-label="다음 해">›</button></div>

<script>
(function(){

function terms(){return S.q.trim().split(/\s+/).filter(Boolean);}

/* ───────── 저장소(IndexedDB): 지난 해 탭은 한 번만 받아 보관 ───────── */
function idb(){return new Promise(function(res,rej){try{var r=indexedDB.open('ufo-wiki',1);r.onupgradeneeded=function(){r.result.createObjectStore('kv');};r.onsuccess=function(){res(r.result);};r.onerror=function(){rej(r.error);};}catch(e){rej(e);}});}

function kvClear(){return idb().then(function(db){return new Promise(function(res){var t=db.transaction('kv','readwrite');t.objectStore('kv').clear();t.oncomplete=function(){res();};t.onerror=function(){res();};});}).catch(function(){});}

/* ───────── 시트 값 → 기록으로 바꾸기 ───────── */
function tokensOf(s){
  var out=[],seen={};
  String(s||'').split(/[\n,+;]+/).forEach(function(p){
    p=p.trim();var m=/^([IPN]\d{2}\d*)(?:-.*)?$/.exec(p);if(!m||seen[p])return;seen[p]=1;
    var parts=p.split('-'),code=m[1];
    out.push({raw:p,code:code,top:code.slice(0,3),dim:code[0]==='I'?'관심사':code[0]==='P'?'업종':'기타',name:parts[1]||'',label:parts.slice(1).join(' › ')||code});
  });
  return out;
}
function parseDate(s,year){
  s=String(s||'').trim();var m=/(\d{4})\s*[-./]\s*(\d{1,2})\s*[-./]\s*(\d{1,2})/.exec(s);
  if(m)return m[1]+'-'+pad(+m[2])+'-'+pad(+m[3]);
  m=/^(\d{1,2})\s*[\/.]\s*(\d{1,2})$/.exec(s);if(m)return year+'-'+pad(+m[1])+'-'+pad(+m[2]);
  return '';
}
function adminKey(s){
  var m;if((m=/profiles\/(\d+)/.exec(s)))return 'p'+m[1];if((m=/app_num=(\d+)/.exec(s)))return 'a'+m[1];if((m=/pf\.kakao\.com\/(_\w+)/.exec(s)))return 'k'+m[1];return '';
}
function parseTab(t){
  var year=+CFG.tabRe.exec(t.title)[1],v=t.values||[],hdr=(v[0]||[]).map(function(x){return String(x||'').trim();}),ix={},warn=[];
  Object.keys(COLS).forEach(function(k){ix[k]=hdr.indexOf(COLS[k]);});
  ['date','name','concl'].forEach(function(k){if(ix[k]<0)warn.push(COLS[k]);});
  var rows=[];
  for(var i=1;i<v.length;i++){
    var r=v[i]||[];

    var marker=String(r[0]||'').trim();

    var name=g('name').trim(),concl=g('concl'),q=g('q');
    if(!name&&!concl.trim()&&!q.trim())continue;

    var o={id:t.title+':'+(i+1),tab:t.title,year:year,row:i+1,sheetId:t.sheetId,marker:marker,
      meeting:g('meeting').trim(),worker:g('worker').trim(),date:parseDate(g('date'),year),
      adminUrl:um?um[0].replace(/[.,;]+$/,''):'',name:name||'(이름 없음)',issue:g('issue').trim(),q:q,concl:concl,
      cat1:g('cat1'),cat2:g('cat2'),inq:g('inq').trim(),kakao:g('kakao'),src:g('src'),check:g('check'),prev:g('prev')};
    o.tokens=tokensOf(o.cat1).concat(tokensOf(o.cat2));

    o.hayName=norm(o.name);
    o.hay=norm([o.name,o.meeting,o.worker,o.issue,o.q,o.concl,o.cat1,o.cat2,o.inq,o.kakao,o.prev,o.tab,o.adminUrl].join(' '));
    rows.push(o);

function parseCat(values){
  var tops={관심사:[],업종:[],기타:[]},names={},subs={};
  (values||[]).slice(1).forEach(function(r){
    [[3,4,'관심사'],[6,7,'업종']].forEach(function(c){var code=String(r[c[0]]||'').trim(),full=String(r[c[1]]||'').trim();if(/^[IPN]\d{2}$/.test(code)){tops[c[2]].push(code);names[code]=full.split('-').slice(1).join('-')||code;}});
    var n=String(r[9]||'').trim();if(/^N\d{2}/.test(n)){var cd=n.split('-')[0];tops['기타'].push(cd);names[cd]=n.split('-').slice(1).join('-')||cd;}
    tokensOf(r[0]).forEach(function(t){if(t.code!==t.top){(subs[t.top]=subs[t.top]||{})[t.code]=t.label;}});
  });
  return {tops:tops,names:names,subs:subs};
}

/* ───────── 데이터 모음 ───────── */
var DB={rows:[],groups:{},tops:{관심사:[],업종:[],기타:[]},topName:{},subs:{},tabs:[],meetings:[],issues:[],years:[THISYEAR],last:'',meta:null,warn:[]};
function ingest(tabs,catValues,meta){
  var rows=[],warn=[];
  tabs.forEach(function(t){var p=parseTab(t);rows=rows.concat(p.rows);if(p.warn.length)warn.push(t.title+' 탭에서 찾지 못한 열: '+p.warn.join(', '));});

  var cat=parseCat(catValues),tops={관심사:cat.tops.관심사.slice(),업종:cat.tops.업종.slice(),기타:cat.tops.기타.slice()},names=Object.assign({},cat.names),subs={};
  Object.keys(cat.subs).forEach(function(t){subs[t]=Object.assign({},cat.subs[t]);});
  rows.forEach(function(r){r.tokens.forEach(function(t){
    if(tops[t.dim].indexOf(t.top)<0)tops[t.dim].push(t.top);
    if(!names[t.top]&&t.code===t.top)names[t.top]=t.name||t.top;
    if(!names[t.top]&&t.name)names[t.top]=t.name;
    if(t.code!==t.top){(subs[t.top]=subs[t.top]||{})[t.code]=t.label;}
  });});
  var ys=rows.map(function(r){return r.date?+r.date.slice(0,4):0;}).filter(Boolean);
  var mn=ys.length?Math.min.apply(null,ys):THISYEAR,mx=Math.max(THISYEAR,ys.length?Math.max.apply(null,ys):THISYEAR);
  var dates=rows.map(function(r){return r.date;}).filter(function(d){return d&&d<=TODAY;}).sort();
  var uniq=function(f){var o={};rows.forEach(function(r){if(r[f])o[r[f]]=1;});return Object.keys(o).sort();};
  DB={rows:rows,groups:groups,tops:tops,topName:names,subs:subs,tabs:Array.from(new Set(rows.map(function(r){return r.tab;}))).sort().reverse(),
      meetings:uniq('meeting'),issues:uniq('issue'),years:[mn,mx],last:dates.length?dates[dates.length-1]:'',meta:meta||null,warn:warn};
  fillSelects();
}

/* ───────── 거르기 ───────── */
var S={q:'',scope:'all',view:'find',dim:'관심사',cfind:'',cat:null,preset:'all',from:'',to:'',year:THISYEAR,tab:'',meet:'',issue:'',sort:'new',sel:null,selRow:null,open:false,side:false,group:true,limit:80};
function inCat(r,c){if(!c)return true;if(c.top==='미기재')return r.tokens.length===0;return r.tokens.some(function(t){return t.top===c.top&&(!c.sub||t.code===c.sub);});}
function inQ(r){
  var ts=terms();if(!ts.length)return true;var h=S.scope==='name'?r.hayName:r.hay,ch=null;
  return ts.every(function(t){
    if(isCho(t)){ch=ch||(S.scope==='name'?(r._chn=r._chn||norm(cho(r.name))):(r._cha=r._cha||norm(cho(r.name+' '+r.concl+' '+r.q))));return ch.indexOf(t)>=0;}
    return h.indexOf(norm(t))>=0;});
}
function inP(r){return (!S.from||(r.date&&r.date>=S.from))&&(!S.to||(r.date&&r.date<=S.to));}
function inF(r){return (!S.tab||r.tab===S.tab)&&(!S.meet||r.meeting===S.meet)&&(!S.issue||r.issue===S.issue);}
function pass(r,skip){return inQ(r)&&inF(r)&&(skip==='cat'||inCat(r,S.cat))&&(skip==='period'||inP(r));}
function matched(){
  var a=DB.rows.filter(function(r){return pass(r);});
  if(S.sort==='old')a.sort(function(x,y){return cmpNew(y,x);});
  else if(S.sort==='name')a.sort(function(x,y){return x.name.localeCompare(y.name,'ko')||cmpNew(x,y);});
  return a;
}
function setPreset(p){
  S.preset=p;var y=THISYEAR;
  var map={all:['',''],last:[DB.last,DB.last],month:[TODAY.slice(0,8)+'01',TODAY],'3m':[addMonths(TODAY,-3),TODAY],year:[y+'-01-01',TODAY],prev:[(y-1)+'-01-01',(y-1)+'-12-31']};
  S.from=map[p][0];S.to=map[p][1];
  if(p==='prev')S.year=y-1;else if(p!=='all')S.year=y;
}
function periodLabel(){
  if(!S.from&&!S.to)return '';
  var n={last:'지난 회의 '+(DB.last?DB.last.slice(5).replace('-','/')+'('+wd(DB.last)+')':''),month:'이번 달','3m':'최근 3개월',year:'올해',prev:'작년'};

  if(/^m-/.test(S.preset))return S.preset.slice(2,6)+'년 '+(+S.preset.slice(7))+'월';

}
function catLabel(t){return t.label;}
function topName(top){return top==='미기재'?'분류 미기재':(DB.topName[top]||top);}
function diffOf(n,o){
  var c=[],f=function(a,b,l){var A=a.tokens.map(function(t){return t.raw;}).join(' / '),B=b.tokens.map(function(t){return t.raw;}).join(' / ');return A!==B?l:null;};
  var a1=n.tokens.filter(function(t){return t.dim==='관심사';}).map(function(t){return t.label;}).join(', ')||'미기재',b1=o.tokens.filter(function(t){return t.dim==='관심사';}).map(function(t){return t.label;}).join(', ')||'미기재';
  var a2=n.tokens.filter(function(t){return t.dim!=='관심사';}).map(function(t){return t.label;}).join(', ')||'미기재',b2=o.tokens.filter(function(t){return t.dim!=='관심사';}).map(function(t){return t.label;}).join(', ')||'미기재';
  if(a1!==b1)c.push('관심사: '+b1+' → '+a1);if(a2!==b2)c.push('업종: '+b2+' → '+a2);return c;
}
function changed(rs){for(var i=1;i<rs.length;i++){if(diffOf(rs[i-1],rs[i]).length)return true;}return false;}

/* ───────── 그리기 ───────── */

  }

/* ───────── 로그인 · 시트 읽기 ───────── */
var token=null,tokenExp=0,tc=null,waiters=[],cacheObj=null,busy=false;
function msg(html,err){var m=$('w-msg');if(!html){m.hidden=true;return;}m.hidden=false;m.className='w-msg'+(err?' err':'');m.innerHTML=html;}
function syncText(t){$('w-sync').textContent=t;}
function showLogin(on,title,text){
  $('w-login').hidden=!on;if(title)$('w-login-t').textContent=title;if(text)$('w-login-p').textContent=text;
}
function haveData(){return DB.rows.length>0;}
function setUi(){
  var has=haveData();$('w-bodywrap').hidden=!has;$('w-refresh').hidden=!has&&!token;$('w-all').hidden=!has;$('w-logout').hidden=!(has||token||localStorage.getItem(CFG.signedKey));
  $('w-refresh').disabled=busy;$('w-all').disabled=busy;
}
function describeSync(){
  var m=DB.meta;if(!m){syncText('');return;}
  var parts=Object.keys(m.tabs||{}).sort().reverse().map(function(t){var c=m.tabs[t];return t.replace('회의록_','')+' 탭 '+(Date.now()-c.fetchedAt<60000?'방금 받음':'보관본('+rel(c.fetchedAt)+')');});
  syncText((token?'● 로그인됨 · ':'○ 로그인 전 · 저장본 · ')+parts.join(' · '));
}
function initAuth(){
  if(tc)return true;if(!window.google||!google.accounts||!google.accounts.oauth2)return false;
  tc=google.accounts.oauth2.initTokenClient({client_id:CFG.clientId,scope:CFG.scope,hd:CFG.hd,callback:onTok,error_callback:onTokErr});return true;
}
function onTok(resp){
  var ws=waiters;waiters=[];
  if(!resp||resp.error){var e={code:'auth',msg:(resp&&resp.error)||'로그인이 취소됐어요.'};ws.forEach(function(w){w.rej(e);});return;}
  token=resp.access_token;tokenExp=Date.now()+(Math.max(60,+resp.expires_in||3600)-60)*1000;
  try{localStorage.setItem(CFG.signedKey,'1');}catch(e){}
  ws.forEach(function(w){w.res(token);});
}
function onTokErr(err){
  var ws=waiters;waiters=[];var t=err&&err.type;
  var e={code:'auth',type:t,msg:t==='popup_failed_to_open'?'로그인 창이 막혔어요. 브라우저 주소창 오른쪽의 팝업 차단을 풀고 다시 눌러 주세요.':t==='popup_closed'?'로그인 창이 닫혔어요.':'로그인에 실패했어요.'};
  ws.forEach(function(w){w.rej(e);});
}
function getToken(){
  if(token&&Date.now()<tokenExp)return Promise.resolve(token);
  if(!initAuth())return Promise.reject({code:'gsi',msg:'구글 로그인 스크립트를 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요.'});
  return new Promise(function(res,rej){waiters.push({res:res,rej:rej});if(waiters.length===1)tc.requestAccessToken({});});
}
function api(url,retry){
  return getToken().then(function(t){return fetch(url,{headers:{Authorization:'Bearer '+t}});}).then(function(r){
    if(r.status===401&&!retry){token=null;return api(url,true);}
    if(!r.ok)return r.json().catch(function(){return {};}).then(function(j){throw {code:r.status,msg:(j.error&&j.error.message)||''};});
    return r.json();});
}
function errText(e){
  if(!e)return '알 수 없는 오류가 났어요.';
  if(e.code===403)return '<b>이 시트를 볼 권한이 없어요.</b> 회의록 시트를 공유받은 회사 계정으로 로그인했는지 확인하고, 아니라면 시트 소유자에게 공유를 요청해 주세요.'+(e.msg?' <span style="opacity:.7">('+esc(e.msg)+')</span>':'');
  if(e.code===404)return '<b>시트를 찾지 못했어요.</b> 시트 주소가 바뀌었는지 확인해 주세요.';
  if(e.code===429)return '<b>요청이 잠시 몰렸어요.</b> 1분쯤 뒤에 다시 눌러 주세요.';
  if(e.code==='auth'||e.code==='gsi')return '<b>'+esc(e.msg)+'</b>';
  return '<b>시트를 읽지 못했어요.</b> '+esc(e.msg||String(e.code||e.message||e));
}
function setBusy(b,text){busy=b;if(text)syncText(text);setUi();}
function saveCache(){return kvSet('cache',cacheObj);}
function applyCache(){
  var tabs=Object.keys(cacheObj.tabs).sort().map(function(k){var c=cacheObj.tabs[k];return {title:k,sheetId:c.sheetId,values:c.values};});
  ingest(tabs,cacheObj.cat&&cacheObj.cat.values,{tabs:cacheObj.tabs});
  var yrs=DB.years;if(S.year>yrs[1]||S.year<yrs[0])S.year=yrs[1];
  renderHero();render();setUi();describeSync();
  if(DB.warn.length)msg('<b>시트 열 이름을 확인해 주세요.</b> '+esc(DB.warn.join(' / ')),true);
}
function yearOf(t){return +CFG.tabRe.exec(t)[1];}
function sync(opt){
  opt=opt||{};if(DEMO||busy)return Promise.resolve();
  msg('');setBusy(true,'시트 확인 중…');
  var yt=[],hasCat=false,metaTabs=null;
  return api(API+CFG.sheetId+'?fields=sheets.properties(sheetId,title)').then(function(meta){
    metaTabs=meta.sheets.map(function(s){return s.properties;});
    yt=metaTabs.filter(function(p){return CFG.tabRe.test(p.title);});
    hasCat=metaTabs.some(function(p){return p.title===CFG.catTab;});
    if(!yt.length)throw {code:'x',msg:'「회의록_연도」 이름의 탭을 찾지 못했어요.'};
    var maxY=Math.max.apply(null,yt.map(function(p){return yearOf(p.title);}));
    cacheObj=cacheObj||{tabs:{},cat:null};
    var need=yt.filter(function(p){var c=cacheObj.tabs[p.title],y=yearOf(p.title);
      return opt.force||!c||y>=THISYEAR||y===maxY||(Date.now()-c.fetchedAt)>CFG.pastMaxAgeDays*86400000||c.sheetId!==p.sheetId;});
    var ranges=need.map(function(p){return "'"+p.title+"'!A:V";});
    if(hasCat)ranges.push("'"+CFG.catTab+"'!A:J");
    syncText((need.length?need.map(function(p){return p.title.replace('회의록_','');}).join('·')+' 탭 받는 중…':'새로 받을 탭이 없어요'));
    if(!ranges.length)return {need:need,vr:[]};
    var url=API+CFG.sheetId+'/values:batchGet?'+ranges.map(function(r){return 'ranges='+encodeURIComponent(r);}).join('&')+'&valueRenderOption=FORMATTED_VALUE&majorDimension=ROWS';
    return api(url).then(function(j){return {need:need,vr:j.valueRanges||[]};});
  }).then(function(res){
    var now=Date.now();
    res.need.forEach(function(p,i){cacheObj.tabs[p.title]={sheetId:p.sheetId,values:(res.vr[i]&&res.vr[i].values)||[],fetchedAt:now};});
    if(hasCat){var k=res.need.length;cacheObj.cat={values:(res.vr[k]&&res.vr[k].values)||[],fetchedAt:now};}
    Object.keys(cacheObj.tabs).forEach(function(t){if(!yt.some(function(p){return p.title===t;}))delete cacheObj.tabs[t];});
    cacheObj.savedAt=now;
    return saveCache();
  }).then(function(){showLogin(false);applyCache();}).catch(function(e){
    if(e&&e.code==='auth'&&haveData()){msg(opt.auto?'저장해 둔 내용을 보여 주고 있어요. 위쪽 <b>「새로 받기」</b>를 누르면 로그인해서 최신 내용으로 바꿔요.':'저장해 둔 내용을 보여 주고 있어요. <b>'+esc(e.msg)+'</b>',false);}
    else{msg(errText(e),true);}
    if(!haveData())showLogin(true,'로그인이 필요해요','아래 버튼을 눌러 회사 구글 계정으로 로그인해 주세요.');
    describeSync();
  }).then(function(){setBusy(false);describeSync();});
}
function logout(){
  try{if(token&&window.google&&google.accounts&&google.accounts.oauth2)google.accounts.oauth2.revoke(token,function(){});}catch(e){}
  token=null;tokenExp=0;cacheObj=null;try{localStorage.removeItem(CFG.signedKey);}catch(e){}
  kvClear().then(function(){
    DB={rows:[],groups:{},tops:{관심사:[],업종:[],기타:[]},topName:{},subs:{},tabs:[],meetings:[],issues:[],years:[THISYEAR],last:'',meta:null,warn:[]};
    S.sel=null;S.open=false;msg('');renderHero();render();syncText('');setUi();
    showLogin(true,'로그아웃했어요','이 브라우저에 저장해 둔 회의록도 지웠어요. 다시 보려면 로그인해 주세요.');
  });
}

/* ───────── 이벤트 ───────── */
function hashSel(){var m=/^#d=(.+)$/.exec(location.hash);if(m){var k=decodeURIComponent(m[1]);if(DB.groups[k]){S.sel=k;S.selRow=null;S.open=true;}}}
$('w-form').addEventListener('submit',function(e){e.preventDefault();S.q=$('w-q').value;S.limit=80;if(S.view==='dict')S.view='find';render();});
$('w-q').addEventListener('input',function(e){S.q=e.target.value;S.limit=80;if(S.view==='dict')S.view='find';render();});
$('w-scope').addEventListener('change',function(e){S.scope=e.target.value;S.limit=80;render();});
$('w-recent').addEventListener('click',function(){setPreset('last');S.view='meeting';S.limit=80;render();});
document.querySelector('.w-tabs').addEventListener('click',function(e){var b=e.target.closest('.w-tab');if(!b)return;S.view=b.dataset.v;S.limit=80;render();});
$('w-dim').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;S.dim=b.dataset.d;render();});
$('w-cfind').addEventListener('input',function(e){S.cfind=e.target.value;renderSide();});
$('w-creset').addEventListener('click',function(){S.cat=null;S.cfind='';$('w-cfind').value='';render();});
$('w-tree').addEventListener('click',function(e){
  var b=e.target.closest('.w-node');if(!b)return;var t=b.dataset.top,s=b.dataset.sub;
  if(!t)S.cat=null;else if(s)S.cat=(S.cat&&S.cat.sub===s)?{dim:S.dim,top:t}:{dim:S.dim,top:t,sub:s};
  else S.cat=(S.cat&&S.cat.top===t&&!S.cat.sub)?null:{dim:S.dim,top:t};
  if(S.view==='dict')S.view='find';S.limit=80;render();
});
$('w-period').addEventListener('click',function(e){
  var c=e.target.closest('.w-chip');if(c){setPreset(c.dataset.p);S.limit=80;render();return;}
  var m=e.target.closest('.w-mb');if(m&&!m.disabled){var mm=+m.dataset.m,key='m-'+S.year+'-'+pad(mm);
    if(S.preset===key)setPreset('all');else{S.preset=key;S.from=S.year+'-'+pad(mm)+'-01';S.to=monthEnd(S.year,mm);}S.limit=80;render();}
});
$('w-from').addEventListener('change',function(e){S.from=e.target.value;S.preset='custom';render();});
$('w-to').addEventListener('change',function(e){S.to=e.target.value;S.preset='custom';render();});
$('w-yprev').addEventListener('click',function(){S.year--;renderPeriod();});
$('w-ynext').addEventListener('click',function(){S.year++;renderPeriod();});
[['w-ftab','tab'],['w-fmeet','meet'],['w-fissue','issue'],['w-fsort','sort']].forEach(function(p){$(p[0]).addEventListener('change',function(e){S[p[1]]=e.target.value;S.limit=80;render();});});
$('w-fgroup').addEventListener('change',function(e){S.group=e.target.checked;render();});
$('w-applied').addEventListener('click',function(e){
  var b=e.target.closest('[data-x]');if(!b)return;var x=b.dataset.x;
  function clr(k){if(k==='q'){S.q='';$('w-q').value='';}else if(k==='period')setPreset('all');else if(k==='cat')S.cat=null;else{S[k]='';var id={tab:'w-ftab',meet:'w-fmeet',issue:'w-fissue'}[k];if(id)$(id).value='';}}
  if(x==='all')['q','period','cat','tab','meet','issue'].forEach(clr);else clr(x);S.limit=80;render();
});
$('w-main').addEventListener('click',function(e){
  if(e.target.id==='w-more'){S.limit+=80;render();return;}
  var c=e.target.closest('.w-card');
  if(c){var id=c.dataset.id,r=DB.rows.filter(function(x){return x.id===id;})[0];if(r){S.sel=r.gkey;S.selRow=r.id;S.open=true;S.side=false;try{history.replaceState(null,'','#d='+encodeURIComponent(r.gkey));}catch(x){}render();}return;}
  var d=e.target.closest('.w-dict button');if(d){S.dim=d.dataset.dim;S.cat={dim:d.dataset.dim,top:d.dataset.top};S.view='find';S.limit=80;render();}
});
$('w-detail').addEventListener('click',function(e){
  if(e.target.id==='w-dclose'){S.open=false;render();return;}
  var a=e.target.closest('[data-act="copy"]');
  if(a){var url=location.origin+location.pathname+'#d='+encodeURIComponent(S.sel),old=a.textContent;
    var done=function(t){a.textContent=t;setTimeout(function(){a.textContent=old;},1500);};
    try{navigator.clipboard.writeText(url).then(function(){done('복사됨');},function(){done('주소창의 주소를 복사하세요');});}catch(x){done('주소창의 주소를 복사하세요');}}
});
$('w-sopen').addEventListener('click',function(){S.side=true;S.open=false;render();});
$('w-sclose').addEventListener('click',function(){S.side=false;render();});
$('w-refresh').addEventListener('click',function(){sync({});});
$('w-all').addEventListener('click',function(){sync({force:true});});
$('w-logout').addEventListener('click',logout);
$('w-loginbtn').addEventListener('click',function(){msg('');sync({});});
window.addEventListener('hashchange',function(){hashSel();render();});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&(S.open||S.side)){S.open=false;S.side=false;render();}
  if(e.key==='/'&&!/INPUT|SELECT|TEXTAREA/.test((document.activeElement||{}).tagName||'')){e.preventDefault();$('w-q').focus();}
});

/* ───────── 시작 ───────── */
function start(){
  fillSelects();renderHero();render();setUi();
  if(DEMO){
    fetch(DEMO).then(function(r){return r.json();}).then(function(j){
      var tabs=j.tabs.map(function(t){return {title:t.title,sheetId:t.sheetId,values:t.values};});
      var m={};j.tabs.forEach(function(t){m[t.title]={fetchedAt:Date.now()};});
      ingest(tabs,j.cat&&j.cat.values,{tabs:m});S.year=DB.years[1];hashSel();showLogin(false);renderHero();render();setUi();syncText('시험용 데이터(localhost 전용)');
      if(DB.warn.length)msg('<b>시트 열 이름을 확인해 주세요.</b> '+esc(DB.warn.join(' / ')),true);
    }).catch(function(e){msg('<b>시험용 데이터를 읽지 못했어요.</b> '+esc(e.message||e),true);});
    return;
  }
  kvGet('cache').then(function(c){
    if(c&&c.tabs&&Object.keys(c.tabs).length){cacheObj=c;applyCache();hashSel();render();
      if(localStorage.getItem(CFG.signedKey)){syncText('저장본을 보여 주고 있어요 · 로그인 확인 중…');sync({auto:true});}
    }else{
      showLogin(true);
      if(localStorage.getItem(CFG.signedKey)){/* 이전에 로그인한 적 있음: 버튼을 눌러 이어서 */}
    }
    setUi();
  });
}
window.__ufoWiki={state:S,db:function(){return DB;},ingest:ingest,render:render};
var gs=document.createElement('script');gs.src='https://accounts.google.com/gsi/client';gs.async=true;gs.defer=true;
gs.onerror=function(){msg('<b>구글 로그인 스크립트를 불러오지 못했어요.</b> 인터넷 연결이나 사내 보안 설정을 확인해 주세요.',true);};
document.head.appendChild(gs);
start();
})();
</script>
