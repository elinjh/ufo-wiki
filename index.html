<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com/gsi/style; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src https://sheets.googleapis.com https://www.googleapis.com https://openidconnect.googleapis.com https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; base-uri 'none'; form-action 'none'">
<title>UFO 회의록 위키</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="w-root"><div class="w-app" id="app">

  <div class="w-top">
    <span class="w-brand">UFO 회의록 위키</span>
    <span class="w-sync" id="w-sync" aria-live="polite"></span>
    <span class="w-who" id="w-who"></span>
    <button type="button" class="w-btn" id="w-admin-btn" hidden>접근 관리</button>
    <button type="button" class="w-btn" id="w-refresh" hidden>새로 받기</button>
    <button type="button" class="w-btn" id="w-all" hidden>전체 다시 받기</button>
    <button type="button" class="w-btn" id="w-logout" hidden>로그아웃 · 저장본 지우기</button>
  </div>
  <div class="w-msg" id="w-msg" hidden></div>
  <section class="w-admin" id="w-admin" hidden aria-label="접근 관리">
    <div class="w-lhead"><h2>접근 관리 (관리자 전용)</h2><span class="w-count"><a class="w-btn" href="https://docs.google.com/spreadsheets/d/1iqHHHy18JIorj1IhW-1ByCuijYUCYet8MZIkpLLk4y0/edit" target="_blank" rel="noopener noreferrer" style="text-decoration:none">시트 열기 ↗</a> <button type="button" class="w-btn" id="w-admin-close">닫기</button></span></div>
    <div id="w-admin-body"></div>
  </section>

  <header class="w-hero">
    <div>
      <h1>궁금했던 그 기준,<br>여기서 같이 찾아봐요.</h1>
      <p>질문부터 판단의 근거까지, 함께 쌓아 온 기록을 찾아보세요.</p>
      <form class="w-search" id="w-form" role="search">
        <span class="w-ico" aria-hidden="true">⌕</span>
        <input id="w-q" type="search" autocomplete="off" placeholder="키워드, 데이터명, 카테고리로 검색" aria-label="검색어">
        <select id="w-scope" class="w-sel" aria-label="검색 범위"><option value="all">모든 칸</option><option value="name">데이터명만</option></select>
        <button class="w-go" type="submit">검색</button>
      </form>
    </div>
    <button type="button" class="w-recent" id="w-recent" hidden></button>
  </header>

  <div class="w-tabs" role="tablist" aria-label="보기">
    <button type="button" class="w-tab" role="tab" data-v="find">기록 찾기</button>
    <button type="button" class="w-tab" role="tab" data-v="meeting">회의별 보기</button>
    <button type="button" class="w-tab" role="tab" data-v="dict">카테고리 사전</button>
  </div>

  <section class="w-login" id="w-login" hidden>
    <h2 id="w-login-t">회사 구글 계정으로 로그인해 주세요</h2>
    <p id="w-login-p">회의록 시트를 공유받은 분만 내용을 볼 수 있어요. 처음 한 번 로그인하면 다음부터는 저장해 둔 내용을 바로 보여 드려요.</p>
    <label class="w-keep"><input type="checkbox" id="w-keep" checked> 이 기기에 저장본을 보관해요 (다음부터 빠르게 · 공용 PC라면 꺼 주세요)</label>
    <button type="button" class="w-go" id="w-loginbtn">구글 계정으로 로그인</button>
  </section>

  <div class="w-body" id="w-bodywrap" hidden>
    <aside class="w-side" id="w-side" aria-label="분류 탐색">
      <div class="w-sinner">
        <div class="w-shead"><b>분류 탐색</b><span><button type="button" class="w-btn" id="w-creset">초기화</button> <button type="button" class="w-btn w-only-narrow" id="w-sclose">닫기</button></span></div>
        <div class="w-seg" id="w-dim" role="group" aria-label="분류 종류">
          <button type="button" data-d="관심사">관심사</button><button type="button" data-d="업종">업종</button><button type="button" data-d="기타">기타</button>
        </div>
        <input id="w-cfind" class="w-input" type="search" placeholder="분류명 또는 코드 찾기" aria-label="분류 찾기" autocomplete="off">
        <ul class="w-tree" id="w-tree"></ul>
      </div>
    </aside>

    <section class="w-list" aria-label="기록 목록">
      <div class="w-lhead"><h2 id="w-ltitle">함께 살펴본 기록</h2><span class="w-count" id="w-count"></span><button type="button" class="w-btn w-only-narrow" id="w-sopen">분류 ▾</button></div>

      <div class="w-period" id="w-period">
        <div class="w-prow" role="group" aria-label="기간">
          <span class="w-plab">기간</span>
          <button type="button" class="w-chip" data-p="all">전체</button>
          <button type="button" class="w-chip" data-p="last">지난 회의</button>
          <button type="button" class="w-chip" data-p="month">이번 달</button>
          <button type="button" class="w-chip" data-p="3m">최근 3개월</button>
          <button type="button" class="w-chip" data-p="year">올해</button>
          <button type="button" class="w-chip" data-p="prev">작년</button>
          <span class="w-range"><input type="date" id="w-from" class="w-sel" aria-label="시작일"><span>~</span><input type="date" id="w-to" class="w-sel" aria-label="종료일"></span>
        </div>
        <div class="w-months">
          <div class="w-ynav"><button type="button" class="w-btn" id="w-yprev" aria-label="이전 해">‹</button><b id="w-year"></b><button type="button" class="w-btn" id="w-ynext" aria-label="다음 해">›</button></div>
          <div class="w-bars" id="w-bars" role="group" aria-label="월별 논의 건수"></div>
        </div>
      </div>

      <div class="w-filters" id="w-filters">
        <label>탭 <select id="w-ftab" class="w-sel"></select></label>
        <label>회의 <select id="w-fmeet" class="w-sel"></select></label>
        <label>이슈 <select id="w-fissue" class="w-sel"></select></label>
        <label class="w-grp"><input type="checkbox" id="w-fgroup" checked> 같은 데이터 묶기</label>
        <label>정렬 <select id="w-fsort" class="w-sel"><option value="new">최신순</option><option value="old">오래된순</option><option value="name">데이터명순</option></select></label>
      </div>
      <div class="w-applied" id="w-applied"></div>
      <div id="w-main"></div>
    </section>

    <aside class="w-detail" id="w-detail" aria-label="선택한 기록" aria-live="polite"><div id="w-dinner"></div></aside>
  </div>
  <div class="w-foot" id="w-foot"></div>
</div></div>

<script src="app.js"></script>
</body>
</html>
